name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: backend (lint + type + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scholaria
          POSTGRES_PASSWORD: scholaria
          POSTGRES_DB: scholaria
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://scholaria:scholaria@localhost:5432/scholaria
      DATABASE_URL_SYNC: postgresql+psycopg://scholaria:scholaria@localhost:5432/scholaria
      OPENAI_API_KEY: sk-test
      EMBEDDING_PROVIDER: openai
      EMBEDDING_DIM: "1536"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check . && ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Migrate
        working-directory: backend
        run: alembic upgrade head

      - name: Test (pytest)
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: frontend (lint + type + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  eval:
    name: rag eval (faithfulness gate)
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scholaria
          POSTGRES_PASSWORD: scholaria
          POSTGRES_DB: scholaria
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://scholaria:scholaria@localhost:5432/scholaria
      DATABASE_URL_SYNC: postgresql+psycopg://scholaria:scholaria@localhost:5432/scholaria
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Skip if no API key
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          echo "::warning::OPENAI_API_KEY secret not set — skipping eval gate."
          echo "SKIP_EVAL=1" >> $GITHUB_ENV

      - name: Install
        if: ${{ env.SKIP_EVAL != '1' }}
        working-directory: backend
        run: pip install ".[dev,eval]"

      - name: Migrate + seed
        if: ${{ env.SKIP_EVAL != '1' }}
        working-directory: backend
        run: |
          alembic upgrade head
          python -m scripts.seed_demo_docs

      - name: Run Ragas eval gate
        if: ${{ env.SKIP_EVAL != '1' }}
        working-directory: backend
        run: python -m eval.run_eval

      - name: Upload results
        if: ${{ env.SKIP_EVAL != '1' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/eval_results/
