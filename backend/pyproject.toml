[project]
name = "scholaria-backend"
version = "0.1.0"
description = "RAG-powered course Q&A backend"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
    # Data
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    # RAG / LLM
    "openai>=1.109.0",
    "tiktoken>=0.7.0",
    "langchain-core>=0.3.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.3.0",
    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # Misc
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff==0.17.4",  # keep in sync with .pre-commit-config.yaml and CI
    "mypy==2.4.1",
    "types-requests",
    "reportlab>=4.2.0",      # test fixtures + scripts/seed_demo_docs.py
]
# Optional managed reranker (RERANKER_PROVIDER=cohere).
cohere = [
    "cohere>=5.0.0",
]
# Seeding + eval harness (python -m scripts.seed_demo_docs, python -m eval.*). The metrics
# are in-house; the optional LLM judge reuses the core `openai` client.
eval = [
    "reportlab>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "ASYNC",
    "S",   # bandit
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise make `alembic` first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["cohere", "cohere.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One loop for the whole run: the app's pooled async engine is bound to its loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["integration: needs the Postgres test database (skipped when unreachable)"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]
# SQLAlchemy's asyncio layer runs ORM code in greenlets; trace them too.
concurrency = ["thread", "greenlet"]
