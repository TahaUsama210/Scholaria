# fly.toml app configuration file generated for scholaria on 2026-11-05T04:11:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scholaria'
primary_region = 'yyz'
kill_signal = 'SIGINT'
kill_timeout = '15s'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  release_command = 'alembic upgrade head'

[env]
  CHUNK_SIZE_TOKENS = '512'
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  CORS_ORIGINS = 'https://scholaria.fly.dev'
  EMBEDDING_DIM = '384'
  EMBEDDING_MODEL = 'sentence-transformers/all-MiniLM-L6-v2'
  EMBEDDING_PROVIDER = 'local'
  ENVIRONMENT = 'production'
  FORWARDED_ALLOW_IPS = '*'
  LLM_BASE_URL = 'https://api.groq.com/openai/v1'
  LLM_MODEL = 'llama-3.1-8b-instant'
  LLM_PROVIDER = 'openai'
  LOG_LEVEL = 'INFO'
  METRICS_HOST = '::'
  METRICS_PORT = '9091'
  PORT = '8000'
  RERANKER_PROVIDER = 'local'
  RERANK_MIN_SCORE = '-9'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'

[[metrics]]
  port = 9091
  path = '/metrics'
