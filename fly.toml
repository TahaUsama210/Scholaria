# fly.toml — production deploy for the Scholaria backend on Fly.io.
# Provision Postgres separately with `fly postgres create` and attach via
# `fly postgres attach`; that wires DATABASE_URL into this app.

app = "scholaria"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  EMBEDDING_PROVIDER = "openai"
  EMBEDDING_DIM = "1536"
  RERANKER_PROVIDER = "local"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when idle
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
  size = "shared-cpu-1x"

[deploy]
  release_command = "alembic upgrade head"
