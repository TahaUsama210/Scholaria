# fly.toml app configuration file generated for scholaria on 2026-05-07T03:43:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scholaria'
primary_region = 'yyz'
kill_signal = 'SIGINT'
kill_timeout = '10s'

[build]
  dockerfile = 'backend/Dockerfile'

[deploy]
  release_command = 'alembic upgrade head'

[env]
  EMBEDDING_DIM = '1536'
  EMBEDDING_PROVIDER = 'openai'
  ENVIRONMENT = 'production'
  LOG_LEVEL = 'INFO'
  RERANKER_PROVIDER = 'local'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
