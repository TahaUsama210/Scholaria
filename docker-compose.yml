# Local stacks for Scholaria.
#
#   docker compose up --build              dev: Postgres + API (hot reload) + Vite dev server
#   make obs                               dev + Prometheus, Grafana, Jaeger (profile "obs" and
#                                          docker-compose.obs.yml, which wires OTLP tracing)
#   make prod                              the production image (API + SPA in one container)
#   docker compose exec backend python -m scripts.seed_demo_docs
#
# Host ports are overridable so several stacks can run side by side, e.g.
#   DB_PORT=15432 API_PORT=18000 WEB_PORT=15173 docker compose -p scholaria-ci up -d
# The API reads its config from $SCHOLARIA_ENV_FILE (default ./.env, optional); see
# ops/env/offline.env for a profile that needs no API keys.

x-db-env: &db-env
  DATABASE_URL: postgresql+asyncpg://scholaria:scholaria@db:5432/scholaria
  DATABASE_URL_SYNC: postgresql+psycopg://scholaria:scholaria@db:5432/scholaria

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scholaria
      POSTGRES_PASSWORD: scholaria
      POSTGRES_DB: scholaria
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholaria -d scholaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - path: ${SCHOLARIA_ENV_FILE:-.env}
        required: false
    environment:
      <<: *db-env
      HF_HOME: /root/.cache/huggingface
      TIKTOKEN_CACHE_DIR: /root/.cache/tiktoken
      # Bind mounts from Windows/macOS hosts do not deliver inotify events.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - modelcache:/root/.cache
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Vite proxies /api, /healthz and /readyz here, so the browser stays same-origin.
      VITE_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # ---------- observability (profile "obs") ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/scholaria.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    profiles: [obs]
    command: ["--config", "/etc/jaeger/config.yml"]
    volumes:
      - ./ops/jaeger/config.yml:/etc/jaeger/config.yml:ro
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  # ---------- load testing (profile "loadtest") ----------
  # docker compose --profile loadtest run --rm k6 run -q /scripts/load.js
  k6:
    image: grafana/k6:1.3.0
    profiles: [loadtest]
    environment:
      BASE_URL: ${K6_BASE_URL:-http://backend:8000}
      K6_NO_USAGE_REPORT: "true"
    volumes:
      - ./loadtest/k6:/scripts:ro
      - ./loadtest/results:/results
    command: ["run", "-q", "/scripts/smoke.js"]

volumes:
  pgdata:
  modelcache:
  promdata:
